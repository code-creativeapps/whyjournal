<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="228" fill="#8b5cf6"/>
  <!-- Three stacked log rows: each row = a colored bullet + a white bar. -->
  <!-- Row 1: Win (green) -->
  <circle cx="248" cy="356" r="48" fill="#22c55e"/>
  <rect x="328" y="320" width="476" height="72" rx="36" fill="#ffffff"/>
  <!-- Row 2: Habit (purple) -->
  <circle cx="248" cy="516" r="48" fill="#c084fc"/>
  <rect x="328" y="480" width="476" height="72" rx="36" fill="#ffffff"/>
  <!-- Row 3: Milestone (orange) -->
  <circle cx="248" cy="676" r="48" fill="#fb923c"/>
  <rect x="328" y="640" width="476" height="72" rx="36" fill="#ffffff"/>
</svg>
